<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower templates · local review</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #304a36; background: #fbf7ef; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; max-width: 1440px; margin: 0 auto 14px; }
      h1 { margin: 0; font: 600 21px/1.1 Georgia, serif; }
      p { margin: 5px 0 0; color: #70806d; font-size: 12px; }
      .states { display: flex; gap: 7px; }
      button { border: 1px solid #ded5c5; border-radius: 99px; background: #fffdf8; padding: 8px 13px; color: #415b43; font-weight: 700; cursor: pointer; }
      button[aria-pressed="true"] { color: white; background: #405c43; border-color: #405c43; }
      #grid { position: relative; isolation: isolate; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 1440px; height: calc(100vh - 102px); min-height: 430px; margin: auto; }
      .card { position: relative; z-index: 0; min-width: 0; overflow: hidden; border: 1px solid rgba(123, 113, 92, .17); border-radius: 18px; background: rgba(255,253,248,.22); box-shadow: 0 7px 24px rgba(59, 65, 47, .08); }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
      .label { position: absolute; z-index: 2; left: 13px; bottom: 11px; padding: 5px 9px; border: 1px solid rgba(255,255,255,.8); border-radius: 99px; background: rgba(255,253,248,.78); color: #405641; font-size: 11px; font-weight: 700; backdrop-filter: blur(8px); }
      @media (max-width: 700px) { body { padding: 10px; } header { align-items: flex-start; flex-direction: column; } #grid { height: auto; min-height: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); } .card { height: 220px; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Sáu hình mẫu hoa · bộ sinh tham số</h1><p id="state-label">Độ nở 0% · ảnh chụp mô hình trực tiếp</p></div>
      <div class="states" aria-label="Chọn độ nở">
        <button type="button" data-open="0" aria-pressed="true">0%</button>
        <button type="button" data-open="0.5" aria-pressed="false">50%</button>
        <button type="button" data-open="1" aria-pressed="false">100%</button>
      </div>
    </header>
    <main id="grid" aria-label="Sáu hình mẫu hoa"></main>
    <script type="module" src="/src/garden/templatePreview.js"></script>
  </body>
</html>
