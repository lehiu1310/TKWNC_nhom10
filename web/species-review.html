<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Species model review · local</title>
    <style>
      [hidden]{display:none!important}
      :root{font-family:Inter,system-ui,sans-serif;color:#304a36;background:#faf7f0}*{box-sizing:border-box}body{margin:0;padding:16px}header{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:0 auto 12px;gap:12px}h1{font:600 21px Georgia,serif;margin:0}p{font-size:12px;color:#778271;margin:5px 0 0}.nav{display:flex;align-items:center;gap:10px}.nav a,.nav button{padding:7px 11px;border:1px solid #ddd4c6;border-radius:99px;background:#fffdf8;color:#3d563e;text-decoration:none;font-size:12px;font-weight:700}#grid{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:1400px;margin:auto}.card{position:relative;z-index:0;height:210px;overflow:hidden;border:1px solid #e5ded2;border-radius:16px;background:#fffdf9;box-shadow:0 5px 18px #38463410}.card h2{position:absolute;z-index:3;top:9px;left:12px;margin:0;max-width:68%;font:600 13px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{position:absolute;z-index:3;left:12px;top:27px;color:#87907e;font-size:9px}.model-slot{position:absolute;left:0;top:0;bottom:0;width:62%;}.photo{position:absolute;right:7px;top:47px;width:34%;height:150px;object-fit:cover;border-radius:12px;background:#edf1e8}.chip{position:absolute;z-index:4;right:8px;top:8px;padding:4px 7px;border-radius:99px;background:#e8f2df;color:#476948;font-size:8px;font-weight:800}.chip.risk{background:#fff0d5;color:#906a1f}.chip.bad{background:#ffe6e3;color:#a34d4e}.swatch{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:var(--swatch)}.missing{position:absolute;right:8px;top:47px;width:34%;height:150px;display:grid;place-items:center;text-align:center;padding:10px;color:#9b635e;background:#fff0ed;border-radius:12px;font-size:10px}canvas{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}.sheet-note{max-width:1400px;margin:10px auto;color:#778271;font-size:10px}@media(max-width:800px){body{padding:8px}header{align-items:flex-start;flex-direction:column}#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{height:190px}.photo,.missing{height:130px;top:48px}}
      .dense{padding:8px}.dense header{margin-bottom:6px}.dense h1{font-size:15px}.dense p{font-size:9px}.dense .nav{gap:5px}.dense .nav a{padding:4px 7px;font-size:9px}.dense #grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.dense .card{height:96px;border-radius:10px}.dense .card h2{top:5px;left:7px;max-width:70%;font-size:9px}.dense .card small{left:7px;top:18px;font-size:7px}.dense .model-slot{width:65%}.dense .photo,.dense .missing{top:29px;right:4px;width:32%;height:60px;border-radius:7px;font-size:7px}.dense .chip{right:4px;top:4px;padding:3px 5px;font-size:6px}.dense .swatch{width:5px;height:5px}.dense .sheet-note{margin:4px auto;font-size:7px}@media(max-width:800px){.dense #grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dense .card{height:105px}}
    </style>
  </head>
  <body>
    <header><div><h1 id="title">Duyệt mẫu 3D theo loài</h1><p id="summary">Đang nạp loài và ảnh tham khảo…</p></div><nav class="nav"><a id="prev">← Trước</a><a id="next">Tiếp →</a></nav></header>
    <main id="grid" aria-label="Contact sheet mô hình và ảnh hoa"></main>
    <p class="sheet-note">Nhãn cam/đỏ đánh dấu gợi ý tin cậy thấp, fallback ảnh thật hoặc màu ảnh có thể lệch màu dataset. Mọi mô hình ở đây chỉ là bản duyệt, chưa duyệt chất lượng khoa học.</p>
    <script type="module" src="/src/garden/speciesReview.js"></script>
  </body>
</html>
