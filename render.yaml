services:
  - type: web
    name: tkw-nhom10-api
    runtime: docker
    plan: free
    branch: feature-gift-advisor
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "7860"
      - key: MODEL_WARMUP
        value: "0"
      - key: APP_DB_PATH
        value: /app/.data/vuonhoa.sqlite3
      - key: RENDER_FREE_MEMORY
        value: "1"
      - key: RETRIEVAL_BACKEND
        value: classifier
      - key: CLASSIFIER_RETRIEVAL_LABEL_MIN_CONFIDENCE
        value: "0.6"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://tkwnc-nhom10.vercel.app,https://tkwnc-nhom10-aq7ahbp1b-tkwnc-nhom10.vercel.app
      - key: GOOGLE_API_KEY
        sync: false
